name: Sync Upstream Releases

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Fetch and Sync Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: "chrismaltby/gb-studio" # 👈 REPLACE WITH THE UPSTREAM OWNER/REPO (e.g., "twbs/bootstrap")
        run: |
          # 1. Get the latest release tag from upstream
          UPSTREAM_RELEASE=$(gh api repos/$UPSTREAM/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          
          if [ -z "$UPSTREAM_RELEASE" ]; then
            echo "No upstream releases found or repository is private."
            exit 0
          fi
          
          # 2. Check if this release already exists in your fork
          FORK_RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/$UPSTREAM_RELEASE --jq '.tag_name' 2>/dev/null || echo "")
          
          if [ "$FORK_RELEASE" == "$UPSTREAM_RELEASE" ]; then
            echo "Release $UPSTREAM_RELEASE is already synchronized."
            exit 0
          fi
          
          echo "New release found: $UPSTREAM_RELEASE. Syncing..."
          
          # 3. Download release details from upstream
          gh api repos/$UPSTREAM/releases/latest > upstream_release.json
          
          RELEASE_NAME=$(jq -r '.name' upstream_release.json)
          RELEASE_BODY=$(jq -r '.body' upstream_release.json)
          IS_PRERELEASE=$(jq -r '.prerelease' upstream_release.json)
          IS_DRAFT=$(jq -r '.draft' upstream_release.json)
          
          # 4. Fetch the specific tag from upstream to ensure your git history has it
          git remote add upstream https://github.com
          git fetch upstream tag $UPSTREAM_RELEASE
          git push origin $UPSTREAM_RELEASE
          
          # 5. Download assets from upstream release
          mkdir -p assets
          gh release download $UPSTREAM_RELEASE --repo $UPSTREAM --dir ./assets || echo "No assets to download."
          
          # 6. Create the release on your fork with the matching assets
          FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          if [ "$IS_DRAFT" = "true" ]; then FLAGS="$FLAGS --draft"; fi
          
          gh release create "$UPSTREAM_RELEASE" ./assets/* \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_BODY" \
            $FLAGS
