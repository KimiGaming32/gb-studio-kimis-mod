name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Git Setup
        run: |
          git remote add upstream https://github.com/chrismaltby/gb-studio.git
          git fetch upstream
      - name: Merge Upstream
        run: |
          git checkout main
          git merge upstream/main
          git push origin main
